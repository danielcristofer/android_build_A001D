name: Build LineageOS 18.1 for A001D

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 🔥 Checkout do código
    - name: Checkout repository
      uses: actions/checkout@v3

    # 🏗️ Instalar dependências
    - name: Install dependencies
      run: |
        sudo apt-get update || sudo apt-get update --allow-releaseinfo-change
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
          git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush schedtool \
          squashfs-tools xsltproc zip zlib1g-dev

    # 📦 Instalar Repo
    - name: Install Repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo 'PATH=~/bin:$PATH' >> $GITHUB_ENV

    # 🌐 Sincronizar source
    - name: Sync source
      run: |
        mkdir lineage
        cd lineage
        repo init -u https://github.com/LineageOS/android.git -b lineage-18.1 --depth=1
        repo sync -j$(nproc) --force-sync --no-tags --no-clone-bundle

    # 📂 Clonar device, kernel e vendor
    - name: Clone device, kernel, and vendor trees
      run: |
        cd lineage
        git clone https://github.com/danielcristofer/device_asus_A001D.git device/asus/A001D
        git clone https://github.com/danielcristofer/kernel_asus_A001D.git kernel/asus/A001D
        git clone https://github.com/danielcristofer/vendor_asus_A001D.git vendor/asus/A001D

    # 🏗️ Configurar ambiente
    - name: Setup build environment
      run: |
        cd lineage
        source build/envsetup.sh
        lunch lineage_A001D-userdebug

    # 🚀 Buil
